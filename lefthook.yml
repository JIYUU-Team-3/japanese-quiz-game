# https://lefthook.dev/configuration/
#
# Hooks are installed automatically by lefthook's postinstall script when you
# run `pnpm install`. To (re)install them by hand: `pnpm exec lefthook install`.
# To skip them for a single command: `LEFTHOOK=0 git commit ...`

pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: '*.{js,ts,svelte,json,jsonc,css,html,md,yml,yaml}'
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

    - name: lint
      glob: '*.{js,ts,svelte}'
      run: pnpm exec eslint --no-warn-ignored {staged_files}

pre-push:
  parallel: false
  jobs:
    - name: typecheck
      # `pnpm run check` rather than svelte-check directly: it runs `wrangler
      # types` first, and worker-configuration.d.ts is generated, not committed.
      run: pnpm run check

    - name: unit tests
      run: pnpm exec vitest --run
