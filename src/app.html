	<body data-sveltekit-preload-data="hover">

		THESIS: A JLPT drill played on a 1980s Japanese game-center cabinet. It refuses
		the four pastel tiles and countdown ring every quiz app ships.
		OWN-WORLD: Phosphor black tube; beam white, score gold, 1UP red, correct green,
		field blue. DotGothic16 dot-matrix chrome over BIZ UDPGothic answer text.
		Scanlines, bloom, bezel, tabular numerals.
		STORY: A learner reads the HI-SCORE table, presses start, picks N3 or N4,
		survives three lives against a ten-second clock, then earns the right to type a
		name onto the board.
		FIRST VIEWPORT: Attract mode. Title lockup centred in the tube, HI-SCORE table
		beneath it, PUSH START blinking, CREDIT counter bottom right.
		FORM: Japanese arcade cabinet; 3rd on the grounded list, user-pinned over the
		roll. Seed a6e812cb.
		FINISH: unreviewed and undocumented is unfinished; this build ends with the
		finish review, the verdict, DESIGN.md, and every shipping raster carrying its
		provenance.
		-->
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
