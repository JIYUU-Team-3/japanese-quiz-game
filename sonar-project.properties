# SonarCloud analysis configuration.
#
# With Automatic Analysis, SonarCloud reads this file from the default branch,
# so exclusion changes only take effect once they land on `development`.
# projectKey / organization are set by the SonarCloud project binding and are
# only needed here for CI-based scans:
sonar.projectKey=JIYUU-Team-3_japanese-quiz-game
sonar.organization=JIYUU-Team-3

sonar.sources=src,scripts
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# ---------------------------------------------------------------------------
# Excluded from analysis entirely — generated output and build artifacts.
# Nothing here is hand-written, so issues raised against it are not actionable.
# ---------------------------------------------------------------------------
sonar.exclusions=\
  src/lib/paraglide/**,\
  worker-configuration.d.ts,\
  .svelte-kit/**,\
  build/**,\
  .wrangler/**,\
  drizzle/**,\
  static/**,\
  messages/**,\
  project.inlang/**,\
  playwright-report/**,\
  blob-report/**,\
  test-results/**,\
  node_modules/**

# ---------------------------------------------------------------------------
# Analysed for bugs, but not counted against coverage: test code itself and
# build/tooling config that is never exercised by the unit suite.
# ---------------------------------------------------------------------------
sonar.coverage.exclusions=\
  tests/**,\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.spec.svelte.ts,\
  src/lib/vitest-examples/**,\
  *.config.ts,\
  *.config.js,\
  drizzle.config.ts,\
  scripts/**

# ---------------------------------------------------------------------------
# Exempt from duplicate-code detection — repetition here is expected.
# ---------------------------------------------------------------------------
sonar.cpd.exclusions=\
  tests/**,\
  **/*.spec.ts,\
  drizzle/**
